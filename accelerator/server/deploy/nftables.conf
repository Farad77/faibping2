#!/usr/sbin/nft -f

flush ruleset

table inet filter {
    chain input {
        type filter hook input priority 0; policy accept;
        
        # Established/Related traffic
        ct state established,related accept

        # Loopback
        iifname "lo" accept

        # SSH
        tcp dport 22 accept

        # GameTunnel UDP ports
        udp dport { 51820, 4433 } accept

        # Allow ICMP (Ping)
        ip protocol icmp accept
        ip6 nexthdr ipv6-icmp accept
    }

    chain forward {
        type filter hook forward priority 0; policy accept;

        # MSS Clamping to prevent PMTU fragmentation issues with tunnel overhead
        tcp flags syn tcp option maxseg size set rt mtu

        # Allow forwarding between tun-game and WAN (eth0)
        iifname "tun-game" accept
        oifname "tun-game" ct state established,related accept
    }

    chain output {
        type filter hook output priority 0; policy accept;
    }
}

table ip nat {
    chain postrouting {
        type nat hook postrouting priority 100; policy accept;

        # Masquerade outbound traffic from tun-game to the Internet
        oifname "eth0" masquerade
    }
}
