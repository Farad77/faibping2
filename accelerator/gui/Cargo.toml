[package]
name = "accelerator-gui"
version = "0.1.0"
edition = "2021"
authors = ["FastPing Core Team"]

[dependencies]
accelerator-common = { path = "../common" }
accelerator-client = { path = "../client" }
tokio = { version = "1.36", features = ["full"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
